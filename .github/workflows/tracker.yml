name: Scheduled Gmail Sync

# The pipeline itself runs on the Render worker, where all its secrets live.
# This job only wakes the worker every 3 hours, asks it to sync, and waits for the
# result so failures show up here.
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

concurrency:
  group: internpulse-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORKER_URL: ${{ vars.RENDER_WORKER_URL || 'https://ai-job-tracker-worker.onrender.com' }}
      SYNC_API_TOKEN: ${{ secrets.SYNC_API_TOKEN }}
    steps:
      - name: Wake the worker
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 "$WORKER_URL/health" > /dev/null; then echo "Worker is up"; exit 0; fi
            echo "Waiting for the worker to wake ($i/12)..."; sleep 10
          done
          echo "::error::Worker did not respond"; exit 1

      - name: Start a sync
        run: |
          auth=()
          if [ -n "$SYNC_API_TOKEN" ]; then auth=(-H "Authorization: Bearer $SYNC_API_TOKEN"); fi
          curl -fsS --max-time 30 -X POST "${auth[@]}" "$WORKER_URL/api/sync?trigger=schedule&days=7"

      - name: Wait for the result
        run: |
          sleep 5
          for i in $(seq 1 90); do
            health=$(curl -fsS --max-time 30 "$WORKER_URL/health" || echo '{}')
            state=$(echo "$health" | jq -r '.sync_state // "unknown"')
            if [ "$state" != "running" ]; then
              echo "$health" | jq '{sync_state, stats, quota, configured}'
              case "$state" in failed*) echo "::error::$state"; exit 1;; esac
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Sync still running after 15 minutes"
