name: AI Internship Tracker

on:
  schedule:
    # Runs once daily at 08:00 UTC (or trigger on-demand via workflow_dispatch)
    - cron: "0 8 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Never run two syncs at once (they would race on the same records)
concurrency:
  group: internpulse-sync
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      # Offline tests only: no Gmail, Gemini, Supabase or Telegram calls
      - name: Run Offline Tests
        run: pytest

      # Runners start empty; keep the processed-email set and company research
      # cache between runs so emails and job alerts aren't handled twice.
      - name: Restore Pipeline State
        uses: actions/cache@v4
        with:
          path: |
            data/processed_emails.json
            data/company_cache.json
          key: internpulse-state-${{ github.run_id }}
          restore-keys: internpulse-state-

      - name: Run Tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python main.py
